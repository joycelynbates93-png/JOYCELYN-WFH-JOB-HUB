<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joycelyn's Work From Home Job Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fca5d2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Live Image -->
  <img src="WFH.png" usemap="#jobhub-map" alt="Joycelyn's Work From Home Job Hub">

  <!-- Interactive Clickable Hotspots -->
  <map name="jobhub-map">
    <!-- TOP COMPANIES HIRING REMOTELY -->
    <!-- Amazon Remote Careers -->
    <area shape="rect" coords="41,757,120,773" href="https://www.amazon.jobs/en/locations/virtual-locations" alt="Amazon Remote Jobs" target="_blank">

    <!-- UnitedHealth Group Remote Careers -->
    <area shape="rect" coords="158,757,237,773" href="https://careers.unitedhealthgroup.com/search-jobs?acm=ALL&ascf=%5B%7B%22key%22%3A%22custom_fields.WorkSetting%22%2C%22value%22%3A%22Remote%22%7D%5D" alt="UnitedHealth Group Jobs" target="_blank">

    <!-- CVS Health Remote Careers -->
    <area shape="rect" coords="278,757,357,773" href="https://jobs.cvshealth.com/us/en/search-results?keywords=Customer%20Service%20Representative" alt="CVS Health Jobs" target="_blank">

    <!-- Cigna Remote Careers -->
    <area shape="rect" coords="394,757,473,773" href="https://jobs.cigna.com/us/en/search-results?keywords=Remote" alt="Cigna Jobs" target="_blank">

    <!-- Humana Remote Careers -->
    <area shape="rect" coords="511,757,590,773" href="https://careers.humana.com/us/en/search-results?keywords=Remote" alt="Humana Jobs" target="_blank">

    <!-- Telus International Remote Careers -->
    <area shape="rect" coords="627,757,706,773" href="https://jobs.telusdigital.com/" alt="Telus Jobs" target="_blank">

    <!-- Concentrix Remote Careers -->
    <area shape="rect" coords="745,757,824,773" href="https://jobs.concentrix.com/global/en/search-results?keywords=Remote" alt="Concentrix Jobs" target="_blank">

    <!-- TEKsystems Remote Careers -->
    <area shape="rect" coords="864,757,943,773" href="https://www.teksystems.com/en/careers/search-jobs" alt="TEKsystems Jobs" target="_blank">


    <!-- BROWSE JOB CATEGORIES -->
    <!-- Customer Service (Indeed Remote CS Search) -->
    <area shape="rect" coords="75,518,200,541" href="https://www.indeed.com/jobs?q=customer+service&l=Remote" alt="Customer Service Jobs" target="_blank">
    
    <!-- Healthcare & Insurance (Indeed Remote Healthcare Search) -->
    <area shape="rect" coords="305,518,430,541" href="https://www.indeed.com/jobs?q=healthcare+insurance&l=Remote" alt="Healthcare Jobs" target="_blank">

    <!-- Scheduling & Patient Registration -->
    <area shape="rect" coords="540,518,665,541" href="https://www.indeed.com/jobs?q=patient+registration+scheduler&l=Remote" alt="Scheduling Jobs" target="_blank">

    <!-- Technical Support -->
    <area shape="rect" coords="775,518,900,541" href="https://www.indeed.com/jobs?q=technical+support&l=Remote" alt="Technical Support Jobs" target="_blank">

    <!-- Leadership & Team Lead -->
    <area shape="rect" coords="75,645,200,668" href="https://www.indeed.com/jobs?q=remote+team+lead+supervisor&l=Remote" alt="Leadership Jobs" target="_blank">

    <!-- Sales & Appointment Setting -->
    <area shape="rect" coords="305,645,430,668" href="https://www.indeed.com/jobs?q=appointment+setter+sales&l=Remote" alt="Sales Jobs" target="_blank">

    <!-- Remote Jobs With Pay Info -->
    <area shape="rect" coords="540,645,665,668" href="https://www.indeed.com/jobs?q=work+from+home&l=Remote" alt="Jobs With Pay Info" target="_blank">

    <!-- Freelance & Independent -->
    <area shape="rect" coords="775,645,900,668" href="https://www.upwork.com/freelance-jobs/" alt="Freelance Jobs" target="_blank">
  </map>

</body>
</html>
